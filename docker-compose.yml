# docker-compose.yml
# ---------------------------------------------------------------------
# Local development stack: PostgreSQL (data warehouse), Airflow
# (orchestration, single-node LocalExecutor for simplicity), and the ETL
# application container. Kept intentionally minimal — not a production
# Airflow deployment (no CeleryExecutor, no Redis) since this is a
# portfolio project, not an operations exercise.
#
# Usage:
#   docker compose up -d postgres          # just the warehouse
#   docker compose run --rm etl            # run the pipeline once
#   docker compose up -d airflow-init airflow-webserver airflow-scheduler
# ---------------------------------------------------------------------

services:

  postgres:
    image: postgres:15
    container_name: olist_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olist_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-olist_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - olist_pg_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  etl:
    build: .
    container_name: olist_etl
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-olist_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-olist_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./excel:/app/excel

  airflow-init:
    image: apache/airflow:2.9.3
    container_name: olist_airflow_init
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-olist_user}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB:-olist_analytics}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    entrypoint: /bin/bash
    command: -c "airflow db init && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./reports:/opt/airflow/reports
      - ./governance:/opt/airflow/governance

  airflow-webserver:
    image: apache/airflow:2.9.3
    container_name: olist_airflow_webserver
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-olist_user}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB:-olist_analytics}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
    ports:
      - "8080:8080"
    command: webserver
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./reports:/opt/airflow/reports
      - ./governance:/opt/airflow/governance

  airflow-scheduler:
    image: apache/airflow:2.9.3
    container_name: olist_airflow_scheduler
    depends_on:
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-olist_user}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB:-olist_analytics}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./reports:/opt/airflow/reports
      - ./governance:/opt/airflow/governance

volumes:
  olist_pg_data:
